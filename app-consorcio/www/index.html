<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Katari Consórcio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Outfit', 'Segoe UI', Roboto, sans-serif;
            background: #263238;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            overflow: hidden;
        }
        .splash-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        .logo-circle {
            width: 76px;
            height: 76px;
            background: linear-gradient(135deg, #FF6D00, #E65100);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(255, 109, 0, 0.4);
            animation: pulse 2s infinite ease-in-out;
        }
        .logo-letter {
            color: white;
            font-size: 40px;
            font-weight: 900;
            line-height: 1;
        }
        .brand-name {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: #ffffff;
        }
        .brand-sub {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 0.5px;
        }
        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(255, 109, 0, 0.2);
            border-top-color: #FF6D00;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-top: 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }
    </style>
</head>
<body>
    <div class="splash-container">
        <div class="logo-circle">
            <span class="logo-letter">K</span>
        </div>
        <div>
            <div class="brand-name">KATARI</div>
            <div class="brand-sub">Consórcios</div>
        </div>
        <div class="spinner"></div>
    </div>
    <script>
        const TUNNEL_URL = 'https://treaty-mutual-civilization-templates.trycloudflare.com';
        window.location.href = TUNNEL_URL;
    </script>
</body>
</html>
