<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Eldorado Flow Recorder</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:          #0d0f14;
    --surface:     #161922;
    --surface2:    #1e2230;
    --border:      #2a2f42;
    --text:        #e2e8f0;
    --muted:       #64748b;
    --accent:      #6366f1;
    --accent-glow: #6366f120;
    --green:       #10b981;
    --yellow:      #f59e0b;
    --red:         #ef4444;
    --blue:        #3b82f6;
    --purple:      #a855f7;
    --cyan:        #06b6d4;
  }

  body {
    width: 520px;
    min-height: 480px;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    overflow-x: hidden;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(135deg, #0d0f14, #161922);
  }
  .header-logo {
    width: 28px; height: 28px;
    background: linear-gradient(135deg, var(--accent), var(--purple));
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; flex-shrink: 0;
  }
  .header-title { font-weight: 700; font-size: 14px; letter-spacing: -0.3px; }
  .header-sub { font-size: 10px; color: var(--muted); margin-top: 1px; }
  .header-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }

  /* Status dot */
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted);
    box-shadow: 0 0 0 2px transparent;
    transition: background .3s, box-shadow .3s;
  }
  .dot.on { background: var(--green); box-shadow: 0 0 8px var(--green); }

  /* Stats bar */
  .stats-bar {
    display: flex; gap: 1px;
    padding: 0 16px 10px;
    border-bottom: 1px solid var(--border);
    margin-top: 8px;
  }
  .stat {
    flex: 1; text-align: center; padding: 6px 4px;
    background: var(--surface); border-radius: 6px;
    margin: 0 2px;
  }
  .stat-value { font-size: 16px; font-weight: 700; color: var(--accent); font-family: 'JetBrains Mono'; }
  .stat-label { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-top: 2px; }

  /* Toolbar */
  .toolbar {
    display: flex; gap: 6px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
  }
  .btn {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 10px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text);
    cursor: pointer; font-size: 11px; font-family: 'Inter'; font-weight: 500;
    transition: background .15s, border-color .15s, transform .1s;
    white-space: nowrap;
  }
  .btn:hover { background: var(--surface2); border-color: var(--accent); }
  .btn:active { transform: scale(.97); }
  .btn.danger { border-color: #3f2020; }
  .btn.danger:hover { background: #2a1515; border-color: var(--red); color: var(--red); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: #4f46e5; }

  /* Phase filter tabs */
  .phase-tabs {
    display: flex; gap: 4px;
    padding: 8px 16px;
    overflow-x: auto;
    border-bottom: 1px solid var(--border);
    scrollbar-width: none;
  }
  .phase-tabs::-webkit-scrollbar { display: none; }
  .phase-tab {
    padding: 3px 10px; border-radius: 20px; border: 1px solid var(--border);
    background: transparent; color: var(--muted); font-size: 10px; font-weight: 600;
    cursor: pointer; white-space: nowrap; text-transform: uppercase; letter-spacing: .4px;
    transition: all .15s;
  }
  .phase-tab.active, .phase-tab:hover {
    background: var(--accent-glow); border-color: var(--accent); color: var(--text);
  }

  /* Flow list */
  .flow-list {
    max-height: 280px; overflow-y: auto;
    padding: 6px 8px;
    scrollbar-width: thin; scrollbar-color: var(--border) transparent;
  }
  .flow-list::-webkit-scrollbar { width: 4px; }
  .flow-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .empty-state {
    text-align: center; padding: 40px 20px; color: var(--muted);
  }
  .empty-icon { font-size: 32px; margin-bottom: 10px; opacity: .4; }
  .empty-title { font-weight: 600; margin-bottom: 4px; color: var(--text); opacity: .5; }
  .empty-sub { font-size: 11px; line-height: 1.5; }

  /* Step row */
  .step-row {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 8px; border-radius: 8px; margin-bottom: 2px;
    cursor: pointer; transition: background .1s;
    border: 1px solid transparent;
  }
  .step-row:hover { background: var(--surface); border-color: var(--border); }
  .step-row.selected { background: var(--surface2); border-color: var(--accent); }

  .step-idx { font-family: 'JetBrains Mono'; font-size: 9px; color: var(--muted); width: 18px; text-align: right; flex-shrink: 0; }

  .step-phase {
    font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 4px;
    text-transform: uppercase; letter-spacing: .4px; flex-shrink: 0;
    min-width: 64px; text-align: center;
  }
  .phase-PRODUCT  { background: #1a2a1a; color: var(--green); }
  .phase-CHECKOUT { background: #1a1a2a; color: var(--blue); }
  .phase-PAYMENT  { background: #2a1a2a; color: var(--purple); }
  .phase-PIX      { background: #2a2200; color: var(--yellow); }
  .phase-CARD     { background: #2a1a00; color: #f97316; }
  .phase-DS3      { background: #2a0f0f; color: var(--red); }
  .phase-COMPLETE { background: #0f2a1a; color: var(--cyan); }
  .phase-OTHER    { background: #1a1a1a; color: var(--muted); }

  .step-method {
    font-family: 'JetBrains Mono'; font-size: 10px; font-weight: 700;
    width: 36px; flex-shrink: 0; color: var(--muted);
  }
  .method-GET  { color: var(--green); }
  .method-POST { color: var(--blue); }
  .method-PUT  { color: var(--yellow); }
  .method-DELETE { color: var(--red); }
  .method-PATCH { color: var(--purple); }

  .step-url { flex: 1; font-size: 11px; color: var(--text); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .step-url .step-path { color: var(--muted); }

  .step-status {
    font-family: 'JetBrains Mono'; font-size: 10px; font-weight: 700;
    width: 30px; text-align: right; flex-shrink: 0;
  }
  .status-2xx { color: var(--green); }
  .status-3xx { color: var(--cyan); }
  .status-4xx { color: var(--yellow); }
  .status-5xx { color: var(--red); }
  .status-0   { color: var(--muted); }

  .step-ms { font-size: 9px; color: var(--muted); width: 36px; text-align: right; flex-shrink: 0; }

  /* Detail panel */
  .detail-panel {
    border-top: 1px solid var(--border);
    background: var(--surface);
    display: none;
  }
  .detail-panel.visible { display: block; }

  .detail-tabs { display: flex; border-bottom: 1px solid var(--border); }
  .detail-tab {
    padding: 8px 14px; font-size: 11px; font-weight: 500; color: var(--muted);
    cursor: pointer; border-bottom: 2px solid transparent;
    transition: color .15s, border-color .15s;
  }
  .detail-tab.active { color: var(--text); border-color: var(--accent); }

  .detail-content {
    padding: 10px 14px; max-height: 160px; overflow-y: auto;
    font-family: 'JetBrains Mono'; font-size: 11px; line-height: 1.6; color: var(--text);
    word-break: break-all; white-space: pre-wrap;
    scrollbar-width: thin; scrollbar-color: var(--border) transparent;
  }

  .replay-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 14px; border-top: 1px solid var(--border);
  }
  .replay-label { font-size: 10px; color: var(--muted); flex: 1; }
</style>
</head>
<body>

<div class="header">
  <div class="header-logo">⚡</div>
  <div>
    <div class="header-title">Eldorado Flow Recorder</div>
    <div class="header-sub">Captura · Analisa · Replay in-browser</div>
  </div>
  <div class="header-right">
    <div class="dot" id="captureDot"></div>
    <span id="captureLabel" style="font-size:10px;color:var(--muted)">gravando</span>
  </div>
</div>

<div class="stats-bar">
  <div class="stat"><div class="stat-value" id="statTotal">0</div><div class="stat-label">Total</div></div>
  <div class="stat"><div class="stat-value" id="statEld" style="color:var(--green)">0</div><div class="stat-label">Eldorado</div></div>
  <div class="stat"><div class="stat-value" id="statPayment" style="color:var(--purple)">0</div><div class="stat-label">Pagamento</div></div>
  <div class="stat"><div class="stat-value" id="statErrors" style="color:var(--red)">0</div><div class="stat-label">Erros</div></div>
</div>

<div class="toolbar">
  <button class="btn primary" id="btnRefresh">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.5"/></svg>
    Atualizar
  </button>
  <button class="btn" id="btnToggleCapture">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><rect x="9" y="9" width="6" height="6"/></svg>
    Pausar
  </button>
  <button class="btn" id="btnExport">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    HAR
  </button>
  <button class="btn danger" id="btnClear">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>
    Limpar
  </button>
</div>

<div class="phase-tabs" id="phaseTabs">
  <button class="phase-tab active" data-phase="ALL">Todos</button>
  <button class="phase-tab" data-phase="PRODUCT">Produto</button>
  <button class="phase-tab" data-phase="CHECKOUT">Checkout</button>
  <button class="phase-tab" data-phase="PAYMENT">Pagamento</button>
  <button class="phase-tab" data-phase="PIX">Pix</button>
  <button class="phase-tab" data-phase="CARD">Cartão</button>
  <button class="phase-tab" data-phase="DS3">3DS</button>
  <button class="phase-tab" data-phase="COMPLETE">Concluído</button>
</div>

<div class="flow-list" id="flowList">
  <div class="empty-state">
    <div class="empty-icon">📡</div>
    <div class="empty-title">Aguardando requests</div>
    <div class="empty-sub">Abra o Eldorado.gg e navegue até<br>a página de compra para começar a gravar.</div>
  </div>
</div>

<div class="detail-panel" id="detailPanel">
  <div class="detail-tabs">
    <div class="detail-tab active" data-tab="url">URL</div>
    <div class="detail-tab" data-tab="reqBody">Request Body</div>
    <div class="detail-tab" data-tab="resBody">Response</div>
    <div class="detail-tab" data-tab="reqHeaders">Headers</div>
  </div>
  <div class="detail-content" id="detailContent"></div>
  <div class="replay-bar">
    <span class="replay-label" id="replayLabel">Selecione um request para replicar</span>
    <button class="btn primary" id="btnReplay" disabled>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      Replay In-Browser
    </button>
  </div>
</div>

<!-- Banner de capture 3DS -->
<div id="ds3Banner" style="
  display:none;
  padding:10px 16px;
  background:linear-gradient(135deg,#1e0030,#2d0050);
  border-top:1px solid #a855f7;
  display:none;
  align-items:center;
  gap:10px;
">
  <span style="background:#a855f7;color:#fff;padding:2px 8px;border-radius:4px;font-weight:700;font-size:10px;flex-shrink:0;">3DS CLONADO</span>
  <div style="flex:1;min-width:0;">
    <div style="font-weight:600;font-size:12px;" id="ds3Bank">—</div>
    <div style="font-size:10px;color:#94a3b8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" id="ds3Url">—</div>
  </div>
  <button class="btn primary" id="btnViewClone" style="font-size:10px;padding:4px 10px;">
    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
    Ver Clone
  </button>
</div>

<script src="popup.js"></script>
</body>
</html>
