<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Privacy Shield Pro</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --success: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      width: 320px;
      padding: 16px;
      background: var(--bg-gradient);
      color: var(--text-main);
      overflow: hidden;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-icon {
      font-size: 20px;
    }

    h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #fff;
    }

    .badge-pro {
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      color: #0f172a;
      font-size: 9px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 9999px;
      text-transform: uppercase;
    }

    .status-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(8px);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 14px;
    }

    .grid-shields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      font-size: 11px;
    }

    .shield-item {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
    }

    .shield-item.active {
      color: #e2e8f0;
    }

    .shield-dot {
      width: 6px;
      height: 6px;
      background: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 6px rgba(16, 185, 129, 0.6);
    }

    .details-row {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: var(--text-muted);
    }

    .btn-action {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
    }

    .btn-action:hover {
      background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(239, 68, 68, 0.4);
    }

    .btn-action:active {
      transform: translateY(0);
    }

    .feedback {
      margin-top: 10px;
      padding: 8px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34d399;
      font-size: 11px;
      font-weight: 600;
      text-align: center;
      border-radius: 6px;
      display: none;
      animation: fadeIn 0.2s ease-out;
    }

    .hint {
      margin-top: 10px;
      font-size: 10px;
      color: #64748b;
      text-align: center;
      line-height: 1.4;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-container">
      <span class="logo-icon">🛡️</span>
      <h1>Privacy Shield</h1>
      <span class="badge-pro">PRO</span>
    </div>
  </div>

  <div class="status-card">
    <div class="grid-shields">
      <div class="shield-item active"><span class="shield-dot"></span>WebGL (NVIDIA)</div>
      <div class="shield-item active"><span class="shield-dot"></span>Canvas 2D Jitter</div>
      <div class="shield-item active"><span class="shield-dot"></span>AudioContext Noise</div>
      <div class="shield-item active"><span class="shield-dot"></span>WebRTC IP Mask</div>
      <div class="shield-item active"><span class="shield-dot"></span>Font Metric Spoof</div>
      <div class="shield-item active"><span class="shield-dot"></span>Screen 1920x1080</div>
    </div>
    <div class="details-row">
      <span>Seed da Sessão: <b id="seedVal">...</b></span>
      <span>Limpezas: <b id="cleanVal">0</b></span>
    </div>
  </div>

  <button id="clearBtn" class="btn-action">
    <span>🧹</span> Limpar Rastros & Renovar Identidade
  </button>

  <div id="feedback" class="feedback">
    ✨ Rastros limpos & Nova Identidade gerada!
  </div>

  <div class="hint">
    Recomendado: Clique antes de iniciar qualquer fluxo de compra no site.
  </div>

  <script src="popup.js"></script>
</body>
</html>
